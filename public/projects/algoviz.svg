<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="100%" stop-color="#E1ECFF"/>
    </linearGradient>
    <pattern id="dotsAV" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2F6BFF" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgAV)"/>
  <rect width="800" height="450" fill="url(#dotsAV)"/>

  <!-- Big blue blob top-left -->
  <ellipse cx="120" cy="90" rx="160" ry="90" fill="#7AA0FF" opacity="0.35"/>
  <!-- Pink blob bottom-right -->
  <ellipse cx="700" cy="380" rx="180" ry="100" fill="#FFB4C8" opacity="0.45"/>
  <!-- Yellow accent -->
  <circle cx="660" cy="80" r="50" fill="#FFD93D" opacity="0.85"/>
  <circle cx="660" cy="80" r="50" fill="none" stroke="#1A2238" stroke-width="3"/>

  <!-- Sorting bars -->
  <g transform="translate(80,260)">
    <rect x="0"   y="40"  width="32" height="80"  rx="6" fill="#7AA0FF" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="42"  y="20"  width="32" height="100" rx="6" fill="#2F6BFF" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="84"  y="-20" width="32" height="140" rx="6" fill="#FFD93D" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="126" y="10"  width="32" height="110" rx="6" fill="#FF7BA0" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="168" y="-10" width="32" height="130" rx="6" fill="#7AA0FF" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="210" y="30"  width="32" height="90"  rx="6" fill="#FFD93D" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="252" y="-30" width="32" height="150" rx="6" fill="#2F6BFF" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="294" y="0"   width="32" height="120" rx="6" fill="#FF7BA0" stroke="#1A2238" stroke-width="2.5"/>
  </g>

  <!-- Graph nodes -->
  <g transform="translate(490,140)">
    <line x1="40"  y1="40"  x2="120" y2="20"  stroke="#1A2238" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="20"  x2="200" y2="60"  stroke="#1A2238" stroke-width="3" stroke-linecap="round"/>
    <line x1="40"  y1="40"  x2="120" y2="120" stroke="#1A2238" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="200" y2="60"  stroke="#1A2238" stroke-width="3" stroke-linecap="round"/>
    <line x1="120" y1="20"  x2="120" y2="120" stroke="#1A2238" stroke-width="3" stroke-linecap="round"/>

    <circle cx="40"  cy="40"  r="20" fill="#FFD93D" stroke="#1A2238" stroke-width="3"/>
    <circle cx="120" cy="20"  r="20" fill="#FF7BA0" stroke="#1A2238" stroke-width="3"/>
    <circle cx="200" cy="60"  r="20" fill="#7AA0FF" stroke="#1A2238" stroke-width="3"/>
    <circle cx="120" cy="120" r="20" fill="#2F6BFF" stroke="#1A2238" stroke-width="3"/>
  </g>

  <!-- Chat bubble bottom-left -->
  <g transform="translate(70,330)">
    <rect x="0" y="0" width="220" height="70" rx="20" fill="#FFFFFF" stroke="#1A2238" stroke-width="3"/>
    <path d="M30 70 L24 86 L52 70 Z" fill="#FFFFFF" stroke="#1A2238" stroke-width="3"/>
    <circle cx="32"  cy="35" r="6" fill="#2F6BFF"/>
    <circle cx="56"  cy="35" r="6" fill="#FFD93D"/>
    <circle cx="80"  cy="35" r="6" fill="#FF7BA0"/>
    <rect x="100" y="28" width="100" height="14" rx="7" fill="#E1ECFF"/>
  </g>

  <!-- Sparkles -->
  <g fill="#1A2238">
    <text x="380" y="80"  font-family="sans-serif" font-size="22" font-weight="700">✦</text>
    <text x="420" y="180" font-family="sans-serif" font-size="18" font-weight="700">✧</text>
    <text x="500" y="380" font-family="sans-serif" font-size="20" font-weight="700">★</text>
  </g>

  <!-- Title sticker -->
  <g transform="translate(60,30)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#1A2238"/>
    <text x="90" y="27" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="20" font-weight="700" fill="#FFD93D">AlgoViz</text>
  </g>
</svg>
