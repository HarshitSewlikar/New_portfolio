<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgOV" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3EC"/>
      <stop offset="100%" stop-color="#FFF6CC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgOV)"/>

  <!-- Soft blue blob top -->
  <ellipse cx="180" cy="60" rx="200" ry="80" fill="#7AA0FF" opacity="0.30"/>
  <!-- Yellow blob right -->
  <ellipse cx="720" cy="280" rx="160" ry="120" fill="#FFD93D" opacity="0.45"/>

  <!-- Browser window -->
  <g transform="translate(140,100)">
    <rect x="0" y="0" width="520" height="290" rx="18" fill="#FFFFFF" stroke="#1A2238" stroke-width="3"/>
    <!-- Top bar -->
    <rect x="0" y="0" width="520" height="38" rx="18" fill="#FFF6CC" stroke="#1A2238" stroke-width="3"/>
    <circle cx="22" cy="19" r="6" fill="#FF7BA0" stroke="#1A2238" stroke-width="2"/>
    <circle cx="44" cy="19" r="6" fill="#FFD93D" stroke="#1A2238" stroke-width="2"/>
    <circle cx="66" cy="19" r="6" fill="#7AA0FF" stroke="#1A2238" stroke-width="2"/>

    <!-- Hero text bars -->
    <rect x="24" y="62"  width="240" height="18" rx="9" fill="#1A2238"/>
    <rect x="24" y="90"  width="320" height="12" rx="6" fill="#7AA0FF"/>
    <rect x="24" y="110" width="280" height="12" rx="6" fill="#7AA0FF" opacity="0.6"/>
    <rect x="24" y="138" width="110" height="28" rx="14" fill="#FFD93D" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="146" y="138" width="90"  height="28" rx="14" fill="#FFFFFF" stroke="#1A2238" stroke-width="2.5"/>

    <!-- Product cards -->
    <g transform="translate(24,190)">
      <rect x="0"   y="0" width="150" height="80" rx="12" fill="#FFE3EC" stroke="#1A2238" stroke-width="2.5"/>
      <circle cx="32" cy="32" r="18" fill="#FF7BA0" stroke="#1A2238" stroke-width="2.5"/>
      <rect x="60"  y="22" width="70" height="10" rx="5" fill="#1A2238"/>
      <rect x="60"  y="38" width="50" height="8"  rx="4" fill="#1A2238" opacity="0.5"/>
      <rect x="14"  y="62" width="50" height="10" rx="5" fill="#FFD93D" stroke="#1A2238" stroke-width="2"/>

      <rect x="170" y="0" width="150" height="80" rx="12" fill="#E1ECFF" stroke="#1A2238" stroke-width="2.5"/>
      <circle cx="202" cy="32" r="18" fill="#7AA0FF" stroke="#1A2238" stroke-width="2.5"/>
      <rect x="230" y="22" width="70" height="10" rx="5" fill="#1A2238"/>
      <rect x="230" y="38" width="50" height="8"  rx="4" fill="#1A2238" opacity="0.5"/>
      <rect x="184" y="62" width="50" height="10" rx="5" fill="#FFD93D" stroke="#1A2238" stroke-width="2"/>

      <rect x="340" y="0" width="150" height="80" rx="12" fill="#FFF6CC" stroke="#1A2238" stroke-width="2.5"/>
      <circle cx="372" cy="32" r="18" fill="#FFD93D" stroke="#1A2238" stroke-width="2.5"/>
      <rect x="400" y="22" width="70" height="10" rx="5" fill="#1A2238"/>
      <rect x="400" y="38" width="50" height="8"  rx="4" fill="#1A2238" opacity="0.5"/>
      <rect x="354" y="62" width="50" height="10" rx="5" fill="#FF7BA0" stroke="#1A2238" stroke-width="2"/>
    </g>
  </g>

  <!-- Sticker badge -->
  <g transform="translate(580,80) rotate(12)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="#1A2238"/>
    <text x="80" y="27" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="#7AA0FF">Django MVT</text>
  </g>

  <!-- Sparkles -->
  <text x="60"  y="400" font-family="sans-serif" font-size="22" font-weight="700" fill="#1A2238">✦</text>
  <text x="700" y="420" font-family="sans-serif" font-size="18" font-weight="700" fill="#1A2238">✧</text>
</svg>
