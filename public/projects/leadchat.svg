<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgLC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E1ECFF"/>
      <stop offset="100%" stop-color="#FFE3EC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgLC)"/>

  <!-- Yellow blob -->
  <ellipse cx="700" cy="80" rx="140" ry="90" fill="#FFD93D" opacity="0.55"/>
  <!-- Blue blob -->
  <ellipse cx="80"  cy="380" rx="180" ry="100" fill="#7AA0FF" opacity="0.45"/>

  <!-- Sidebar (left) -->
  <g transform="translate(40,80)">
    <rect x="0" y="0" width="200" height="320" rx="18" fill="#FFFFFF" stroke="#1A2238" stroke-width="3"/>
    <rect x="14" y="20" width="120" height="14" rx="7" fill="#1A2238"/>
    <rect x="14" y="48" width="170" height="60" rx="12" fill="#FFF6CC" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="24" y="60"  width="80"  height="10" rx="5" fill="#1A2238"/>
    <rect x="24" y="78"  width="120" height="10" rx="5" fill="#1A2238" opacity="0.5"/>
    <rect x="24" y="94"  width="60"  height="6"  rx="3" fill="#7AA0FF"/>

    <rect x="14" y="120" width="170" height="60" rx="12" fill="#FFE3EC" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="24" y="132" width="80"  height="10" rx="5" fill="#1A2238"/>
    <rect x="24" y="150" width="120" height="10" rx="5" fill="#1A2238" opacity="0.5"/>

    <rect x="14" y="192" width="170" height="60" rx="12" fill="#E1ECFF" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="24" y="204" width="80"  height="10" rx="5" fill="#1A2238"/>
    <rect x="24" y="222" width="120" height="10" rx="5" fill="#1A2238" opacity="0.5"/>

    <!-- Distribution bars -->
    <rect x="14" y="268" width="170" height="40" rx="12" fill="#FFF6CC" stroke="#1A2238" stroke-width="2.5"/>
    <rect x="24" y="294" width="20" height="6" rx="3" fill="#2F6BFF"/>
    <rect x="48" y="288" width="30" height="12" rx="3" fill="#FFD93D"/>
    <rect x="82" y="282" width="40" height="18" rx="3" fill="#FF7BA0"/>
    <rect x="126" y="290" width="50" height="10" rx="3" fill="#7AA0FF"/>
  </g>

  <!-- Chat area (right) -->
  <g transform="translate(280,80)">
    <rect x="0" y="0" width="480" height="320" rx="18" fill="#FFFFFF" stroke="#1A2238" stroke-width="3"/>

    <!-- User message (right) -->
    <g transform="translate(140,30)">
      <rect x="0" y="0" width="320" height="42" rx="18" fill="#2F6BFF" stroke="#1A2238" stroke-width="2.5"/>
      <text x="160" y="27" text-anchor="middle" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">how many leads have budget above 90L?</text>
    </g>

    <!-- Bot message (left) -->
    <g transform="translate(20,90)">
      <rect x="0" y="0" width="380" height="56" rx="18" fill="#FFF6CC" stroke="#1A2238" stroke-width="2.5"/>
      <text x="20" y="22" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" fill="#1A2238">answer: 47 leads match your filter</text>
      <text x="20" y="42" font-family="JetBrains Mono, monospace" font-size="11" fill="#2F6BFF">df[df.budget &gt; 90].count()</text>
    </g>

    <!-- Code block -->
    <g transform="translate(20,162)">
      <rect x="0" y="0" width="440" height="80" rx="14" fill="#1A2238"/>
      <rect x="0" y="0" width="440" height="22" rx="14" fill="#1A2238"/>
      <circle cx="14" cy="11" r="4" fill="#FF7BA0"/>
      <circle cx="28" cy="11" r="4" fill="#FFD93D"/>
      <circle cx="42" cy="11" r="4" fill="#7AA0FF"/>
      <text x="20" y="46" font-family="JetBrains Mono, monospace" font-size="12" fill="#FFD93D">import pandas as pd</text>
      <text x="20" y="64" font-family="JetBrains Mono, monospace" font-size="12" fill="#7AA0FF">result = df.query("budget &gt; 90")</text>
    </g>

    <!-- Result table -->
    <g transform="translate(20,256)">
      <rect x="0" y="0" width="440" height="50" rx="14" fill="#E1ECFF" stroke="#1A2238" stroke-width="2.5"/>
      <circle cx="20" cy="25" r="8" fill="#FF7BA0" stroke="#1A2238" stroke-width="2"/>
      <rect x="40"  y="14" width="80" height="8" rx="4" fill="#1A2238"/>
      <rect x="40"  y="28" width="60" height="6" rx="3" fill="#1A2238" opacity="0.5"/>
      <circle cx="160" cy="25" r="8" fill="#FFD93D" stroke="#1A2238" stroke-width="2"/>
      <rect x="180" y="14" width="80" height="8" rx="4" fill="#1A2238"/>
      <rect x="180" y="28" width="60" height="6" rx="3" fill="#1A2238" opacity="0.5"/>
      <circle cx="300" cy="25" r="8" fill="#7AA0FF" stroke="#1A2238" stroke-width="2"/>
      <rect x="320" y="14" width="80" height="8" rx="4" fill="#1A2238"/>
      <rect x="320" y="28" width="60" height="6" rx="3" fill="#1A2238" opacity="0.5"/>
    </g>
  </g>

  <!-- Sparkles -->
  <text x="40"  y="60"  font-family="sans-serif" font-size="22" font-weight="700" fill="#1A2238">✦</text>
  <text x="760" y="430" font-family="sans-serif" font-size="18" font-weight="700" fill="#1A2238">✧</text>

  <!-- Sticker badge -->
  <g transform="translate(60,40) rotate(-6)">
    <rect x="0" y="0" width="170" height="40" rx="20" fill="#1A2238"/>
    <text x="85" y="27" text-anchor="middle" font-family="Fredoka, sans-serif" font-size="18" font-weight="700" fill="#FF7BA0">LeadChat · AI</text>
  </g>
</svg>
